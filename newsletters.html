<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LIONS 2026 — Newsletters</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#121829; --panel2:#182137; --line:#26314f;
    --txt:#e8edf7; --muted:#8b97b5; --accent:#c8a24a; --accent2:#0b6cff; --win:#3ecf8e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#080b14,#0a0e1a 240px);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:60px}
  header{padding:26px 20px 16px;text-align:center;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:34px;letter-spacing:6px;font-weight:800;
    background:linear-gradient(90deg,var(--accent),#f0d896,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:1px}
  .bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:var(--accent);color:#fff}
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:var(--accent2);border-color:var(--accent2)}

  .stage{max-width:760px;margin:26px auto 0;padding:0 16px;position:relative}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .arrow{font-size:20px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .weekpill{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:center;flex:1}
  .weekpill b{color:var(--accent);font-size:15px;display:block;margin-top:2px}

  .viewport{overflow:hidden;border-radius:16px}
  .track{display:flex;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
  .card{flex:0 0 100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:26px 26px 30px}
  .card-h{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
  .card-h img,.card-h .badge{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex:0 0 auto}
  .badge{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:22px;background:#334}
  .card-h .who{font-size:20px;font-weight:800}
  .card-h .meta{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
  .card-title{font-size:17px;font-weight:700;color:var(--accent);margin:0 0 16px}
  .card-body p{line-height:1.7;font-size:15px;margin:0 0 14px;color:#dbe3f2}
  .card-body p:last-child{margin-bottom:0}

  .dots{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.15s;border:none;padding:0}
  .dot.active{background:var(--accent);transform:scale(1.25)}
  .hint{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}
  .empty,.loading{text-align:center;color:var(--muted);padding:60px 20px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media(max-width:640px){h1{font-size:26px;letter-spacing:3px}.card{padding:20px 18px 24px}}
</style>
</head>
<body>
<header>
  <h1>🦁 LIONS 2026</h1>
  <div class="sub">WEEKLY NEWSLETTERS</div>
  <div class="bar">
    <button class="primary" onclick="location.href='index.html'">🏈 Standings</button>
  </div>
</header>

<div class="stage" id="stage">
  <div class="loading"><span class="spin"></span>Loading newsletters…</div>
</div>

<script>
const AVATARS = { // player name (lowercase) -> avatar file; fallback to initials badge
  fleish:"avatars/fleish.jpg", jakub:"avatars/jakub.jpg", ryan:"avatars/ryan.jpg",
  wolf:"avatars/wolf.jpg", mittman:"avatars/mittman.jpg", swid:"avatars/swid.jpg",
  spence:"avatars/spence.jpg", jake:"avatars/jake.jpg", andy:"avatars/andy.jpg", james:"avatars/james.jpg"
};
let items=[], idx=0;

function fmtDate(s){
  if(!s) return "";
  const d=new Date(s+"T12:00:00");
  return isNaN(d) ? s : d.toLocaleDateString([], {month:'long', day:'numeric', year:'numeric'});
}
function avatar(author){
  const key=(author||"").toLowerCase();
  const src=AVATARS[key];
  const initials=(author||"?").slice(0,2).toUpperCase();
  if(src) return `<img src="${src}" alt="${author}" onerror="this.outerHTML='<span class=&quot;badge&quot;>${initials}</span>'"/>`;
  return `<span class="badge">${initials}</span>`;
}
function paras(body){
  return (body||"").split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,'<br>').replace(/</g,'&lt;')}</p>`).join('');
}

async function load(){
  try{
    const r=await fetch(`newsletters.json?t=${Date.now()}`);
    const d=await r.json();
    items=(d.newsletters||[]).slice().sort((a,b)=>(b.week||0)-(a.week||0)); // newest first
  }catch(e){ items=[]; }
  render();
}

function render(){
  const stage=document.getElementById('stage');
  if(!items.length){ stage.innerHTML=`<div class="empty">No newsletters yet. Check back after this week's edition drops. 📭</div>`; return; }
  idx=Math.max(0,Math.min(idx,items.length-1));
  stage.innerHTML=`
    <div class="nav">
      <button class="arrow" id="prev" title="Newer">‹</button>
      <div class="weekpill">Newsletter <b id="wklabel"></b></div>
      <button class="arrow" id="next" title="Older">›</button>
    </div>
    <div class="viewport" id="vp">
      <div class="track" id="track">
        ${items.map(n=>`
          <article class="card">
            <div class="card-h">
              ${avatar(n.author)}
              <div>
                <div class="who">${n.author||'—'}</div>
                <div class="meta">Week ${n.week||'?'} · ${fmtDate(n.date)}</div>
              </div>
            </div>
            ${n.title?`<h2 class="card-title">${n.title}</h2>`:''}
            <div class="card-body">${paras(n.body)}</div>
          </article>`).join('')}
      </div>
    </div>
    <div class="dots" id="dots">
      ${items.map((n,i)=>`<button class="dot" data-i="${i}" title="Week ${n.week}"></button>`).join('')}
    </div>
    <div class="hint">Swipe, use ← → arrows, or tap the dots to move between weeks</div>`;
  document.getElementById('prev').onclick=()=>go(idx-1);
  document.getElementById('next').onclick=()=>go(idx+1);
  document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));
  attachSwipe();
  update();
}

function go(i){ idx=Math.max(0,Math.min(i,items.length-1)); update(); }
function update(){
  document.getElementById('track').style.transform=`translateX(-${idx*100}%)`;
  document.getElementById('wklabel').textContent=`${items[idx].week||'?'}  ·  ${items.length-idx} of ${items.length}`;
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===items.length-1;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
}

/* swipe (touch) */
function attachSwipe(){
  const vp=document.getElementById('vp'); let x0=null, dx=0;
  vp.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;dx=0;},{passive:true});
  vp.addEventListener('touchmove', e=>{ if(x0!=null) dx=e.touches[0].clientX-x0; },{passive:true});
  vp.addEventListener('touchend', ()=>{ if(Math.abs(dx)>50){ go(idx + (dx<0?1:-1)); } x0=null; });
}
/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') go(idx-1);
  else if(e.key==='ArrowRight') go(idx+1);
});

load();
</script>
</body>
</html>
